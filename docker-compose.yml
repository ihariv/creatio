services:
  postgres:
    extends: { file: docker-compose.base.yml, service: postgres }
    container_name: postgres17-creatio-${ENV_ID}
    ports: ["${DB_PORT}:5432"]
    volumes: ["pg_data_creatio_${ENV_ID}:/var/lib/postgresql/data"]

  redis:
    extends: { file: docker-compose.base.yml, service: redis }
    container_name: redis7-creatio-${ENV_ID}
    ports: ["${REDIS_PORT}:6379"]
    volumes: ["redis_data_creatio_${ENV_ID}:/data"]

  creatio:
    extends: { file: docker-compose.base.yml, service: creatio }
    container_name: creatio83-${ENV_ID}
    mem_limit: 4g # Ограничиваем память контейнера на уровне Docker
    ports:
      - "${HTTP_PORT}:5000"
      - "${HTTPS_PORT}:5002"
    volumes:
      - ../runtime/${ENV_ID}/Logs:/app/Logs
      - ../runtime/${ENV_ID}/Terrasoft.WebHost.dll.config:/app/Terrasoft.WebHost.dll.config:ro
      - ../runtime/${ENV_ID}/ConnectionStrings.config:/app/ConnectionStrings.config:ro
      - ../runtime/${ENV_ID}/Terrasoft.Configuration:/app/Terrasoft.Configuration

volumes:
  pg_data_creatio_dev1:
  pg_data_creatio_dev2:
  redis_data_creatio_dev1:
  redis_data_creatio_dev2: